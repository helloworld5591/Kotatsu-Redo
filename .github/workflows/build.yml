name: Build Debug APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Download parsers source
        run: |
          curl -L "https://github.com/helloworld5591/kotatsu-parsers-redo/archive/master.zip" -o parsers.zip
          unzip -q parsers.zip
          mkdir -p parsers-src
          rm -rf parsers-src/kotatsu-parsers
          mv kotatsu-parsers-redo-master parsers-src/kotatsu-parsers
      - name: Download SSIV source
        run: |
          curl -L "https://github.com/KotatsuApp/subsampling-scale-image-view/archive/376930523c.zip" -o ssiv.zip
          unzip -q ssiv.zip
          mkdir -p ssiv-src
          rm -rf ssiv-src/ssiv
          mv subsampling-scale-image-view-* ssiv-src/ssiv
      - name: Patch broken source code
        run: |
          # Fix the compilation error in KunManga.kt (headers overrides nothing)
          # We remove the 'override' keyword so it compiles as a local property
          sed -i 's/override val headers/val headers/g' parsers-src/kotatsu-parsers/src/main/kotlin/org/koitharu/kotatsu/parsers/site/madara/en/KunManga.kt
      - name: Align SDK and AGP Versions
        run: |
          # Force AGP 8.7.3 everywhere
          sed -i 's/gradle = "8.13.0"/gradle = "8.7.3"/g' gradle/libs.versions.toml
          find parsers-src ssiv-src -name "libs.versions.toml" -exec sed -i 's/agp = .*/agp = "8.7.3"/g' {} +
          find parsers-src ssiv-src -name "libs.versions.toml" -exec sed -i 's/androidGradlePlugin = .*/androidGradlePlugin = "8.7.3"/g' {} +
          find parsers-src ssiv-src -name "build.gradle*" -exec sed -i "s/com.android.tools.build:gradle:[0-9.]*/com.android.tools.build:gradle:8.7.3/g" {} +
          
          # Force SDK 35
          find . -name "build.gradle*" -exec sed -i 's/compileSdk = 36/compileSdk = 35/g' {} +
          find . -name "build.gradle*" -exec sed -i 's/targetSdk = 36/targetSdk = 35/g' {} +
          find . -name "build.gradle*" -exec sed -i 's/compileSdk 36/compileSdk 35/g' {} +
          find . -name "build.gradle*" -exec sed -i 's/targetSdk 36/targetSdk 35/g' {} +
      - name: Tweak Memory and Patch settings.gradle
        run: |
          # Increase memory for Gradle (mandatory for KSP builds)
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8" >> gradle.properties
          
          # Reset settings.gradle
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google { content { includeGroupByRegex("com\\.android.*"); includeGroupByRegex("com\\.google.*"); includeGroupByRegex("androidx.*") } }
                  mavenCentral()
                  gradlePluginPortal()
                  maven { url 'https://jitpack.io'; content { includeGroupByRegex("com\\.github.*") } }
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories { google(); mavenCentral(); maven { url 'https://jitpack.io' } }
          }
          include ':app'
          rootProject.name = "Kotatsu"
          EOF
          
          printf "\nincludeBuild('parsers-src/kotatsu-parsers') {\n    dependencySubstitution {\n        substitute module('com.github.helloworld5591:kotatsu-parsers-redo') using project(':')\n    }\n}\n" >> settings.gradle
          printf "includeBuild('ssiv-src/ssiv') {\n    dependencySubstitution {\n        substitute module('com.github.KotatsuApp:subsampling-scale-image-view') using project(':library')\n    }\n}\n" >> settings.gradle
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --max-workers=2
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk