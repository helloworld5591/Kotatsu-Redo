name: Build Debug APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Patch build files
        run: |
          sed -i '/WorkInspector/d' app/build.gradle
          sed -i '/KizzyRPC/d' app/build.gradle
      - name: Download parsers source
        run: |
          curl -L "https://github.com/helloworld5591/kotatsu-parsers-redo/archive/master.zip" -o parsers.zip
          unzip parsers.zip && mkdir -p parsers-src
          mv kotatsu-parsers-redo-master parsers-src/kotatsu-parsers
      - name: Download SSIV source
        run: |
          curl -L "https://github.com/KotatsuApp/subsampling-scale-image-view/archive/376930523c.zip" -o ssiv.zip
          unzip ssiv.zip && mkdir -p ssiv-src
          mv subsampling-scale-image-view-* ssiv-src/ssiv
          sed -i 's/compileSdk = 34/compileSdk = 36/' ssiv-src/ssiv/library/build.gradle
      - name: Patch settings.gradle with composite builds
        run: |
          cat >> settings.gradle << 'SETTINGS'
includeBuild('parsers-src/kotatsu-parsers') {
    dependencySubstitution {
        substitute module('com.github.clquwu:kotatsu-parsers-redo') using project(':')
    }
}
includeBuild('ssiv-src/ssiv') {
    dependencySubstitution {
        substitute module('com.github.KotatsuApp:subsampling-scale-image-view') using project(':')
    }
}
SETTINGS
      - name: Build APK
        run: ./gradlew assembleDebug --max-workers=2
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
